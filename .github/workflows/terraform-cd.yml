name: CD - GCP IAM RBAC Org (Apply / Destroy)

on:
  workflow_dispatch:
    inputs:
      command:
        description: Terraform operation
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply
      project_id:
        description: GCP project ID
        required: true
        type: string
      region:
        description: GCP region
        required: true
        type: string
        default: us-central1
      backend_bucket:
        description: GCS bucket for Terraform state
        required: true
        type: string
        default: iammwwhobuild-tfstate-bucket
      backend_prefix:
        description: State file prefix
        required: true
        type: string
        default: terraform-iam-rbac
      devops_group_name:
        description: DevOps Google Group name
        required: true
        type: string
        default: devops-team@yourdomain.com
      developer_group_name:
        description: Developer Google Group name
        required: true
        type: string
        default: dev-team@yourdomain.com
      devops_members:
        description: DevOps members as HCL list, e.g. ["user1@x.com"]
        required: false
        type: string
        default: '["bob.ops@yourdomain.com","charlie.ops@yourdomain.com"]'
      developer_members:
        description: Developer members as HCL list, e.g. ["user1@x.com"]
        required: false
        type: string
        default: '["alice.dev@yourdomain.com","eve.dev@yourdomain.com"]'
      team_permissions:
        description: Team permissions as HCL map of lists
        required: false
        type: string
        default: '{"devops-team@yourdomain.com"=["roles/compute.admin","roles/run.admin","roles/cloudbuild.admin","roles/storage.admin"],"dev-team@yourdomain.com"=["roles/compute.viewer","roles/run.developer","roles/cloudbuild.editor","roles/storage.objectUser"]}'

env: {}

jobs:
  provision:
    name: Terraform ${{ github.event.inputs.command }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ github.event.inputs.backend_bucket }}" \
            -backend-config="prefix=${{ github.event.inputs.backend_prefix }}"
      - name: Terraform Plan
        run: |
          terraform plan ${{ github.event.inputs.command == 'destroy' && '-destroy' || '' }} \
            -var="project_id=${{ github.event.inputs.project_id }}" \
            -var="region=${{ github.event.inputs.region }}" \
            -var="devops_group_name=${{ github.event.inputs.devops_group_name }}" \
            -var="developer_group_name=${{ github.event.inputs.developer_group_name }}" \
            -var="devops_members=${{ github.event.inputs.devops_members }}" \
            -var="developer_members=${{ github.event.inputs.developer_members }}" \
            -var="team_permissions=${{ github.event.inputs.team_permissions }}"
      - name: Terraform Apply / Destroy
        run: |
          terraform ${{ github.event.inputs.command }} -auto-approve \
            -var="project_id=${{ github.event.inputs.project_id }}" \
            -var="region=${{ github.event.inputs.region }}" \
            -var="devops_group_name=${{ github.event.inputs.devops_group_name }}" \
            -var="developer_group_name=${{ github.event.inputs.developer_group_name }}" \
            -var="devops_members=${{ github.event.inputs.devops_members }}" \
            -var="developer_members=${{ github.event.inputs.developer_members }}" \
            -var="team_permissions=${{ github.event.inputs.team_permissions }}"
